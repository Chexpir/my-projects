<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A collection of small static toy web apps.">
<meta name="theme-color" content="#020a04">
<title>my-projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020a04; --fg: #33ff66; --dim: #1a8a38; --faint: #0f4a20;
    --glow: 0 0 6px rgba(51,255,102,.75), 0 0 18px rgba(51,255,102,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "VT323", "Courier New", monospace;
    font-size: 24px; line-height: 1.3; text-shadow: var(--glow); overflow-x: hidden;
  }
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  body::before {
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,.28) 4px);
  }
  body::after { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }
  .screen { min-height: 100vh; min-height: 100dvh; padding: 32px 16px; max-width: 760px; margin: 0 auto; animation: flicker 6s infinite; }
  @keyframes flicker { 0%,100%{opacity:1} 48%{opacity:1} 50%{opacity:.93} 52%{opacity:1} 78%{opacity:.96} 80%{opacity:1} }
  h1 { font-weight: normal; font-size: clamp(36px, 11vw, 64px); letter-spacing: .06em; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 28px; }
  .prompt { color: var(--dim); }
  ul { list-style: none; margin: 8px 0 24px; padding: 0; }
  li { margin: 4px 0; }
  a { color: var(--fg); text-decoration: none; }
  a:hover, a:focus-visible { background: var(--fg); color: var(--bg); text-shadow: none; outline: none; }
  .desc { color: var(--dim); }
  .cursor { display: inline-block; width: .55em; height: 1em; background: var(--fg); vertical-align: -.12em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .screen, .cursor { animation: none; } }
</style>
</head>
<body>
<div class="screen">
  <h1>MY-PROJECTS</h1>
  <p class="sub">small static toys. one folder each.</p>

  <div><span class="prompt">&gt;</span> ls</div>
  <!-- To add a project: copy an <li> below. -->
  <ul id="projects">
    <li><a href="typespeed/">typespeed/</a> <span class="desc">&mdash; type a&rarr;z, no mistakes</span></li>
  </ul>

  <div><span class="prompt">&gt;</span> <span class="cursor"></span></div>
</div>
</body>
</html>
