<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Detective de letras: descubre la letra que falta y aprende ortografía.">
<meta name="theme-color" content="#fff8ec">
<title>Detective de letras</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
  .menu { display: flex; flex-direction: column; gap: 8px; }
  .menu h2 { margin: 4px 0 0; font-size: 26px; font-weight: 900; text-align: center; }
  .menu p { margin: 0 0 4px; text-align: center; color: var(--muted); font-weight: 700; }
  .fams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 900px) { .fams { grid-template-columns: repeat(3, 1fr); } }
  .fams li { display: flex; }
  .fam {
    flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 96px; padding: 10px 12px;
    text-align: left; border: 3px solid var(--accent); border-radius: var(--radius);
    background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--accent); cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .fam:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent); }
  .fam__name { font-size: 26px; font-weight: 900; line-height: 1.1; }
  .fam__sub { font-size: 20px; font-weight: 600; color: var(--muted); line-height: 1.15; }
  .fam__mast { margin-top: auto; font-size: 20px; font-weight: 800; }
  .fams li.is-mix { grid-column: 1 / -1; }
  .fam.is-mix { background: var(--accent); color: var(--on-accent); min-height: 80px; }
  .fam.is-mix .fam__sub { color: var(--on-accent); opacity: .85; }

  .play { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .play-top { display: flex; align-items: center; gap: 10px; }
  .play-top .k-btn { min-height: 56px; padding: 0 16px; font-size: 20px; white-space: nowrap; flex: none; }
  .play-top .k-progress { flex: 1; gap: 6px; flex-wrap: nowrap; }
  .play-top .k-progress > i { width: 16px; height: 16px; border-width: 3px; flex: none; }

  .prompt { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px 12px; }
  .prompt-head { display: flex; align-items: center; gap: 10px; }
  .msg { flex: 1; min-width: 0; font-size: 22px; font-weight: 800; color: var(--muted); line-height: 1.2; }
  .msg.is-ok { color: var(--ok); }
  .msg.is-ko { color: var(--ko); }
  .say { flex: none; min-width: 56px; min-height: 56px; border-radius: 50%; border: 2px solid var(--line); background: var(--card);
         font-size: 26px; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .say:active { transform: translateY(2px); }
  .wordrow { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 12px; min-height: 64px; }
  .pic { flex: none; font-size: 48px; line-height: 1; }
  .word { font-size: clamp(30px, 10vw, 56px); font-weight: 900; line-height: 1.1; letter-spacing: 1px; color: var(--ink); white-space: nowrap; }
  .slot { display: inline-block; min-width: 1.1em; margin: 0 2px; border-bottom: 6px solid var(--accent); text-align: center; color: var(--ok); }
  .slot.is-open::after { content: "\00a0"; }
  .slot.is-done { min-width: 0; margin: 0; border-bottom-color: var(--ok); }
  .slot.is-none { display: none; }

  .choices { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 12px; }
  .choices .k-choice { min-height: 72px; padding: 6px 10px; font-size: 34px; font-weight: 900; line-height: 1.1; }
  .choices.is-text { grid-template-columns: 1fr; gap: 10px; }
  .choices.is-text .k-choice { min-height: 72px; padding: 8px 12px; font-size: 28px; font-weight: 800; line-height: 1.15; text-align: center; }
  .choices .k-choice:disabled { cursor: default; }
  .choices .k-choice:disabled:not(.is-ok):not(.is-ko) { opacity: .55; }

  .fb { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .fb__rule { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.25; }
  .fb .k-btn { width: 100%; }
</style>
</head>
<body>
<div class="k-app">
  <header id="k-header"></header>

  <main class="k-screen" id="start" aria-label="Elegir tema">
    <div class="menu">
      <h2>¡Elige una pista!</h2>
      <p>Descubre la letra que falta.</p>
      <ul class="fams" id="fams"></ul>
    </div>
  </main>

  <main class="k-screen play" id="play" hidden aria-label="Partida">
    <div class="play-top">
      <button type="button" class="k-btn k-btn--ghost" id="quit" aria-label="Volver a las pistas">‹ Pistas</button>
      <div class="k-progress" id="dots" aria-hidden="true"></div>
    </div>
    <div class="k-card prompt" id="prompt">
      <div class="prompt-head">
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button type="button" class="say" id="say" aria-label="Escuchar">🔊</button>
      </div>
      <div class="wordrow" id="wordrow">
        <span class="pic" id="pic" aria-hidden="true"></span>
        <span class="word" id="word" role="img"></span>
      </div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb" hidden>
      <div class="fb__rule" id="rule"></div>
      <button type="button" class="k-btn k-btn--big" id="next">Siguiente</button>
    </div>
  </main>
</div>

<script src="../shared/kit.js"></script>

  const $ = (id) => document.getElementById(id);
  const MIX = 'mezcla';

  /* ---------- items ---------- */

  const FAMS = DATA.map((f) => {
    const items = f.items.map((row) => {
      if (f.kind === 'sentence') {
        return { id: f.id + ':' + row[0], fam: f.id, kind: 'sentence', good: row[0], bad: row[1], rule: f.rules[row[2]], tag: row[2] };
      }
      const answer = row[2], tag = row[4] || (answer === '' ? 'none' : answer);
      return { id: f.id + ':' + row[0] + ':' + row[1], fam: f.id, kind: 'gap', full: row[0], gapped: row[1], answer, emoji: row[3] || '',
        choices: f.choices, rule: f.rules[tag], tag };
    });
    return { id: f.id, name: f.name, sub: f.sub, kind: f.kind, choices: f.choices, rules: f.rules, items };
  });
  const BY_ID = {};
  FAMS.forEach((f) => f.items.forEach((it) => { BY_ID[it.id] = it; }));
  const ALL_IDS = Object.keys(BY_ID);

  /* ---------- state ---------- */

  const decks = {};
  FAMS.forEach((f) => { decks[f.id] = Kit.deck(SLUG, f.items.map((i) => i.id)); });
  decks[MIX] = Kit.deck(SLUG, ALL_IDS);

  let topic = MIX, queue = [], pos = 0, score = 0, results = [];
  let mode = 'idle'; // idle | answering | feedback
  let voiceOn = true, order = [], speakToken = 0;

  const el = { start: $('start'), play: $('play'), dots: $('dots'), msg: $('msg'), word: $('word'), pic: $('pic'), wordrow: $('wordrow'),
    choices: $('choices'), fb: $('fb'), rule: $('rule'), next: $('next'), say: $('say') };

  const cur = () => queue[pos];
  const labelOf = (c) => (c === '' ? 'sin h' : c);

  /* ---------- start screen ---------- */

  function showStart() {
    speakToken++;
    mode = 'idle';
    el.play.hidden = true;
    el.start.hidden = false;
    const box = $('fams');
    box.textContent = '';
    FAMS.concat([{ id: MIX, name: 'Mezcla', sub: 'Todas las pistas juntas', mix: true }]).forEach((f) => {
      const st = decks[f.id].stats();
      const li = document.createElement('li');
      if (f.mix) li.className = 'is-mix';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'fam' + (f.mix ? ' is-mix' : '');
      b.dataset.fam = f.id;
      const n = document.createElement('span'); n.className = 'fam__name'; n.textContent = (f.mix ? '🎲 ' : '') + f.name;
      const s = document.createElement('span'); s.className = 'fam__sub'; s.textContent = f.sub;
      const m = document.createElement('span'); m.className = 'fam__mast'; m.textContent = '🔍 ' + st.mastered + '/' + st.total;
      m.setAttribute('aria-label', st.mastered + ' de ' + st.total + ' dominadas');
      b.setAttribute('aria-label', f.name + ', ' + f.sub + '. ' + st.mastered + ' de ' + st.total + ' dominadas');
      b.appendChild(n); b.appendChild(s); b.appendChild(m);
      b.addEventListener('click', () => { Kit.sfx('tap'); startRound(f.id); });
      li.appendChild(b);
      box.appendChild(li);
    });
  }

  /* ---------- round ---------- */

  function startRound(id) {
    topic = id;
    voiceOn = Kit.canSpeak('es');
    queue = decks[id].next(ROUND).map((itemId, i) => ({ it: BY_ID[itemId], orig: i, rep: false }));
    pos = 0; score = 0; results = new Array(queue.length).fill(null);
    el.start.hidden = true;
    el.play.hidden = false;
    $('say').hidden = !voiceOn;
    showItem();
  }

  function renderDots() {
    el.dots.textContent = '';
    const q = queue[pos];
    results.forEach((r, i) => {
      const d = document.createElement('i');
      if (r === true) d.className = 'is-done';
      else if (r === false) d.className = 'is-miss';
      if (q && !q.rep && q.orig === i) d.classList.add('is-current');
      el.dots.appendChild(d);
    });
  }

  function say(text) { return voiceOn ? Kit.speak(text, 'es') : Promise.resolve(); }
  const spoken = (it) => (it.kind === 'sentence' ? it.good : it.full);
  const INSTR = { gap: 'Completa la palabra.', sentence: '¿Cuál está bien escrita?' };

  function renderWord(it, answered) {
    el.word.textContent = '';
    const i = it.gapped.indexOf('_');
    const pre = document.createTextNode(it.gapped.slice(0, i));
    const slot = document.createElement('span');
    slot.className = 'slot';
    if (!answered) slot.classList.add('is-open');
    else if (it.answer === '') slot.classList.add('is-none');
    else { slot.classList.add('is-done'); slot.textContent = it.answer; }
    const post = document.createTextNode(it.gapped.slice(i + 1));
    el.word.appendChild(pre); el.word.appendChild(slot); el.word.appendChild(post);
    el.word.setAttribute('aria-label', answered ? it.full : 'Palabra con un hueco: ' + it.gapped.replace('_', ' hueco '));
  }

  function showItem() {
    const q = cur(), it = q.it;
    speakToken++;
    mode = 'answering';
    renderDots();
    el.fb.hidden = true;
    el.msg.className = 'msg';
    el.msg.textContent = (q.rep ? 'Otra vez. ' : '') + INSTR[it.kind];
    el.say.setAttribute('aria-label', 'Escuchar: ' + INSTR[it.kind]);
    el.choices.textContent = '';
    el.choices.className = 'choices' + (it.kind === 'sentence' ? ' is-text' : '');
    if (it.kind === 'gap') {
      el.wordrow.hidden = false;
      el.pic.textContent = it.emoji;
      el.pic.hidden = !it.emoji;
      renderWord(it, false);
    } else {
      el.wordrow.hidden = true;
    }
    const opts = it.kind === 'gap' ? it.choices.slice() : [it.good, it.bad];
    order = Kit.shuffle(opts);
    el.choices.style.setProperty('--n', order.length);
    order.forEach((value, idx) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'k-choice';
      b.dataset.value = value;
      b.textContent = it.kind === 'gap' ? labelOf(value) : value;
      b.addEventListener('click', () => { choose(idx); b.blur(); });
      el.choices.appendChild(b);
    });
  }

  function choose(idx) {
    if (mode !== 'answering') return;
    const q = cur(), it = q.it;
    const value = order[idx];
    const right = value === (it.kind === 'gap' ? it.answer : it.good);
    mode = 'feedback';
    const counts = !q.rep;

    Array.prototype.forEach.call(el.choices.children, (b, i) => {
      b.disabled = true;
      const isRightBtn = order[i] === (it.kind === 'gap' ? it.answer : it.good);
      if (isRightBtn) b.classList.add('is-ok');
      else if (i === idx) b.classList.add('is-ko');
    });

    if (right) {
      Kit.sfx('ok');
      if (counts) { score++; results[q.orig] = true; decks[topic].mark(it.id, true); }
    } else {
      Kit.sfx('ko');
      if (counts) {
        results[q.orig] = false;
        decks[topic].mark(it.id, false);
        const at = Math.min(queue.length, pos + 1 + Kit.randInt(2, 4));
        queue.splice(at, 0, { it, orig: q.orig, rep: true });
      }
    }
    renderDots();

    if (it.kind === 'gap') { renderWord(it, true); }
    let title;
    if (right) title = '✓ ' + Kit.praise();
    else if (it.kind === 'gap') title = '✗ ' + Kit.encourage() + (it.answer === '' ? ' Sin h.' : ' Va «' + it.answer + '».');
    else title = '✗ ' + Kit.encourage() + ' Es la que tiene ✓.';
    el.msg.className = 'msg ' + (right ? 'is-ok' : 'is-ko');
    el.msg.textContent = title;
    el.say.setAttribute('aria-label', 'Escuchar ' + (it.kind === 'gap' ? 'la palabra' : 'la frase'));
    el.rule.textContent = it.rule;
    el.fb.hidden = false;
    el.next.focus({ preventScroll: true });
    say(spoken(it));
  }

  function next() {
    if (mode !== 'feedback') return;
    Kit.sfx('tap');
    speakToken++;
    pos++;
    if (pos >= queue.length) finish(); else showItem();
  }

  /* ---------- result ---------- */

  function finish() {
    mode = 'idle';
    const extra = document.createElement('div');
    extra.setAttribute('aria-hidden', 'true');
    extra.style.fontSize = '48px';
    extra.textContent = '🔍';
    Kit.result({ slug: SLUG, score, total: ROUND, extra, onAgain: () => startRound(topic),
      actions: [{ label: 'Elegir pista', onClick: showStart }] });
  }

  /* ---------- wiring ---------- */

  el.next.addEventListener('click', next);
  el.say.addEventListener('click', () => {
    if (mode === 'idle') return;
    const it = cur().it;
    if (mode === 'feedback') say(spoken(it));
    else say(INSTR[it.kind] + (it.kind === 'gap' ? ' ' + it.full : ''));
  });
  $('quit').addEventListener('click', () => { Kit.sfx('tap'); showStart(); });

  document.addEventListener('keydown', (e) => {
    if (el.play.hidden || document.querySelector('.k-overlay') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-9]$/.test(e.key) && mode === 'answering') {
      const i = Number(e.key) - 1;
      if (i < order.length) { e.preventDefault(); choose(i); }
    } else if (e.key === 'Enter') {
      if (document.activeElement && document.activeElement.id === 'quit') return;
      if (mode === 'feedback') { e.preventDefault(); next(); }
    }
  });

  /* ---------- self test (data checks) ---------- */

  function selfTest() {
    const problems = [];
    const seen = {};
    const fulls = {};
    FAMS.forEach((f) => f.items.forEach((it) => { if (it.kind === 'gap') fulls[it.full] = true; }));
    FAMS.forEach((f) => {
      if (f.items.length < 20) problems.push(f.id + ': menos de 20 items (' + f.items.length + ')');
      f.items.forEach((it) => {
        const tag = it.id;
        if (seen[it.id]) problems.push('id repetido: ' + it.id);
        seen[it.id] = true;
        if (!it.rule) problems.push(tag + ': falta la regla (' + it.tag + ')');
        if (it.kind === 'gap') {
          const gaps = (it.gapped.match(/_/g) || []).length;
          if (gaps !== 1) problems.push(tag + ': debe tener exactamente un hueco');
          if (f.choices.indexOf(it.answer) < 0) problems.push(tag + ': la respuesta no está entre las opciones');
          if (new Set(f.choices).size !== f.choices.length) problems.push(f.id + ': opciones repetidas');
          if (it.gapped.replace('_', it.answer) !== it.full) problems.push(tag + ': la palabra completa no coincide');
          if (it.full.length > 12) problems.push(tag + ': palabra demasiado larga');
          if (it.full !== it.full.toLowerCase()) problems.push(tag + ': debe estar en minúsculas');
          f.choices.forEach((c) => {
            if (c !== it.answer && fulls[it.gapped.replace('_', c)]) problems.push(tag + ': otra opción también da una palabra del juego');
          });
        } else {
          if (it.good === it.bad) problems.push(tag + ': las dos frases son iguales');
          if (it.good.toLowerCase() !== it.bad.toLowerCase()) problems.push(tag + ': las frases solo deben cambiar en mayúsculas');
          if (it.good.length > 40) problems.push(tag + ': frase demasiado larga');
        }
      });
    });
    return problems;
  }

  Kit.mount({ slug: SLUG, title: 'Detective de letras' });
  Kit.ready.then(showStart);

  // Hooks for the automated checks (not used by the game itself).
  window.__detective = { FAMS, DATA, decks, selfTest, ROUND, startRound, showStart, choose, next,
    peek(id) { startRound(MIX); queue = [{ it: BY_ID[id], orig: 0, rep: false }]; pos = 0; showItem(); },
    get state() { return { topic, pos, mode, score, order: order.slice(), queue: queue.map((q) => q.it.id + (q.rep ? '*' : '')) }; } };
})();
</script>
</body>
</html>
