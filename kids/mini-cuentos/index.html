<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Minicuentos: lee un cuento corto y responde cinco preguntas.">
<meta name="theme-color" content="#fff8ec">
<title>Minicuentos</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>
  .menu { display: flex; flex-direction: column; gap: 10px; }
  .menu h2 { margin: 4px 0 0; font-size: 26px; font-weight: 900; text-align: center; }
  .menu p { margin: 0; text-align: center; color: var(--muted); font-weight: 700; }
  .lvl {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 8px 14px;
    text-align: left; border: 3px solid var(--accent); border-radius: var(--radius);
    background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--accent); cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .lvl:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent); }
  .lvl__e { flex: none; font-size: 36px; line-height: 1; }
  .lvl__t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  .lvl__name { font-size: 24px; font-weight: 900; }
  .lvl__sub { font-size: 20px; font-weight: 600; color: var(--muted); }
  .lvl__side { flex: none; font-size: 20px; font-weight: 800; text-align: right; }
  .lvl__bar { display: flex; gap: 3px; margin-top: 4px; }
  .lvl__bar i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: block; }
  .lvl__bar i.on { background: var(--ok); border-color: var(--ok); }

  .bar { display: flex; align-items: center; gap: 10px; }
  .bar .k-btn { min-height: 56px; padding: 0 16px; font-size: 20px; white-space: nowrap; flex: none; }
  .bar .k-progress { flex: 1; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; }
  .bar .k-progress > i { width: 16px; height: 16px; border-width: 3px; flex: none; }

  .k-app.is-playing { height: 100vh; height: 100dvh; }
  .read, .quiz { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .story { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .story__top { display: flex; align-items: center; gap: 10px; }
  .story__emoji { font-size: 34px; letter-spacing: 4px; line-height: 1.1; flex: none; }
  .story__title { margin: 0; font-size: 24px; font-weight: 900; line-height: 1.15; }
  .story__text { margin: 0; font-size: clamp(20px, 5.4vw, 28px); line-height: 1.5; font-weight: 600; }
  .sn { border-radius: 8px; padding: 1px 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sn.is-reading { background: #ffe9a6; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .sn.is-answer { background: var(--ok-bg); box-shadow: 0 0 0 3px var(--ok); font-weight: 800; }
  .banner { margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--ok-bg); border: 2px solid var(--ok); font-size: 20px; font-weight: 800; }
  .row { display: flex; gap: 8px; }
  .row .k-btn { flex: 1; min-width: 0; padding: 0 12px; white-space: nowrap; }
  .row .k-btn--big { flex: 1 1 0; font-size: 24px; padding: 0 8px; }
  .row .k-btn--ghost { flex: none; }

  .q-card { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; }
  .q-card h2 { flex: 1; margin: 0; font-size: clamp(22px, 5.8vw, 28px); font-weight: 900; line-height: 1.2; }
  .say { flex: none; min-width: 56px; min-height: 56px; border-radius: 50%; border: 2px solid var(--line);
         background: var(--card); font-size: 26px; cursor: pointer; touch-action: manipulation; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opts .k-choice { justify-content: flex-start; text-align: left; font-size: clamp(22px, 5.6vw, 28px); line-height: 1.15; min-height: 64px; padding: 8px 14px; }
  .opts .k-choice:disabled { cursor: default; }
  .dock { display: grid; margin-top: auto; }
  .dock > * { grid-area: 1 / 1; }
  .fb { display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: stretch; }
  .fb__title { font-size: 26px; font-weight: 900; }
  .fb__title.is-ok { color: var(--ok); }
  .fb__title.is-ko { color: var(--ko); }
  .fb__ans { font-size: 20px; font-weight: 800; margin: 0; }
  .again { width: 100%; }
</style>
</head>
<body>
<div class="k-app">
  <header id="k-header"></header>

  <main class="k-screen" id="start" aria-label="Elegir cuentos">
    <div class="menu">
      <h2>¡Vamos a leer!</h2>
      <p>Elige cuánto quieres leer.</p>
      <div id="levels" class="menu"></div>
    </div>
  </main>

  <main class="k-screen read" id="read" hidden aria-label="Cuento">
    <div class="bar">
      <button type="button" class="k-btn k-btn--ghost" id="rquit" aria-label="Volver a los cuentos">‹ Cuentos</button>
    </div>
    <p class="banner" id="banner" hidden></p>
    <div class="k-card story" id="story">
      <div class="story__top"><span class="story__emoji" id="s-emoji" aria-hidden="true"></span><h2 class="story__title" id="s-title"></h2></div>
      <p class="story__text" id="s-text"></p>
    </div>
    <div class="row">
      <button type="button" class="k-btn k-btn--ghost" id="listen">🔊 Escuchar</button>
      <button type="button" class="k-btn k-btn--big" id="done">Ya lo he leído</button>
    </div>
  </main>

  <main class="k-screen quiz" id="quiz" hidden aria-label="Preguntas">
    <div class="bar">
      <button type="button" class="k-btn k-btn--ghost" id="qquit" aria-label="Volver a los cuentos">‹ Cuentos</button>
      <div class="k-progress" id="dots" aria-hidden="true"></div>
    </div>
    <div class="k-card q-card">
      <h2 id="qtext"></h2>
      <button type="button" class="say" id="say" aria-label="Escuchar la pregunta">🔊</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="dock">
      <button type="button" class="k-btn k-btn--ghost again" id="reread">📖 Volver a leer</button>
      <div class="fb" id="fb" hidden role="status" aria-live="polite">
        <div class="fb__title" id="fb-title"></div>
        <p class="fb__ans" id="fb-ans" hidden></p>
        <button type="button" class="k-btn k-btn--big" id="next">Siguiente</button>
      </div>
    </div>
  </main>
</div>

<script src="../shared/kit.js"></script>
<script>
(function () {
  'use strict';

  /* ===== DATA: stories (edit here) =====
     len: 's' (30-40 words), 'm' (50-60), 'l' (70-90).
     text: the sentences of the story. qs: five questions, one of each kind:
       lit (literal), ord (order), why (reason), feel (feeling), voc (vocabulary).
     ok: the right option. bad: two wrong options. s: index in `text` of the sentence that holds the answer. */
  const STORIES = [
    /* ---- cortos ---- */
    { id: 'nube', len: 's', title: 'Nube, la gata', emoji: ['🐱', '🌧️', '🏠'],
      text: ['Nube es una gata blanca.', 'Hoy llueve mucho y no puede salir al jardín.', 'Se sube a la ventana y mira las gotas de lluvia.', 'Después se echa en su cama y se duerme.', 'Está muy contenta en casa.'],
      qs: [
        { k: 'lit', q: '¿Cómo es Nube?', ok: 'Una gata blanca', bad: ['Un gato negro', 'Un perro blanco'], s: 0 },
        { k: 'ord', q: '¿Qué hace Nube después de mirar las gotas?', ok: 'Se duerme', bad: ['Sale al jardín', 'Come pescado'], s: 3 },
        { k: 'why', q: '¿Por qué no sale Nube al jardín?', ok: 'Porque llueve mucho', bad: ['Porque está enferma', 'Porque no quiere'], s: 1 },
        { k: 'feel', q: '¿Cómo está Nube en casa?', ok: 'Contenta', bad: ['Enfadada', 'Asustada'], s: 4 },
        { k: 'voc', q: '¿Qué son las gotas de lluvia?', ok: 'Trocitos de agua', bad: ['Hojas del jardín', 'Piedras pequeñas'], s: 2 }
      ] },
    { id: 'mochila', len: 's', title: 'La mochila nueva', emoji: ['🎒', '✏️', '⭐'],
      text: ['Ana tiene una mochila nueva.', 'Es azul y tiene una estrella.', 'Guarda dentro su estuche con lápices y su libro.', 'Mañana la llevará al colegio.', 'Ana sonríe porque le gusta mucho.'],
      qs: [
        { k: 'lit', q: '¿De qué color es la mochila?', ok: 'Azul', bad: ['Roja', 'Verde'], s: 1 },
        { k: 'ord', q: '¿Qué hará Ana después de guardar sus cosas?', ok: 'Llevará la mochila al colegio', bad: ['Se irá al parque', 'Comprará otra mochila'], s: 3 },
        { k: 'why', q: '¿Por qué sonríe Ana?', ok: 'Porque le gusta su mochila', bad: ['Porque hoy no hay cole', 'Porque pierde un lápiz'], s: 4 },
        { k: 'feel', q: '¿Cómo se siente Ana?', ok: 'Alegre', bad: ['Triste', 'Cansada'], s: 4 },
        { k: 'voc', q: '¿Qué es un estuche?', ok: 'Una caja para guardar lápices', bad: ['Una prenda de abrigo', 'Un tipo de libro'], s: 2 }
      ] },
    { id: 'pan-abuelo', len: 's', title: 'El pan del abuelo', emoji: ['👴', '🍞', '👧'],
      text: ['El abuelo Pepe hace pan por la mañana.', 'Mezcla harina, agua y sal para hacer la masa.', 'Luego la deja descansar.', 'Cuando el pan sale del horno, huele muy bien.', 'Su nieta lo prueba y dice que está riquísimo.'],
      qs: [
        { k: 'lit', q: '¿Qué mezcla el abuelo?', ok: 'Harina, agua y sal', bad: ['Leche y azúcar', 'Huevos y queso'], s: 1 },
        { k: 'ord', q: '¿Qué hace el abuelo después de mezclar?', ok: 'Deja descansar la masa', bad: ['Saca el pan del horno', 'Prueba el pan'], s: 2 },
        { k: 'why', q: '¿Por qué huele tan bien?', ok: 'Porque el pan sale del horno', bad: ['Porque hay flores', 'Porque hace sol'], s: 3 },
        { k: 'feel', q: '¿Qué siente la nieta al probar el pan?', ok: 'Le gusta mucho', bad: ['Le da asco', 'Tiene miedo'], s: 4 },
        { k: 'voc', q: '¿Qué es la masa?', ok: 'Lo que se mezcla para hacer pan', bad: ['El horno donde se cuece', 'El nombre de la niña'], s: 1 }
      ] },
    { id: 'luna', len: 's', title: 'La luna de Mía', emoji: ['🌕', '⭐', '🛏️'],
      text: ['Esta noche la luna está grande y redonda.', 'Mía la mira desde su ventana porque no puede dormir.', 'Cuenta diez estrellas pequeñas a su lado.', 'Se siente feliz y tranquila.', 'Al final cierra los ojos y sueña con volar.'],
      qs: [
        { k: 'lit', q: '¿Qué cuenta Mía?', ok: 'Diez estrellas', bad: ['Diez nubes', 'Diez pájaros'], s: 2 },

        { k: 'why', q: '¿Por qué mira Mía la luna?', ok: 'Porque no puede dormir', bad: ['Porque tiene frío', 'Porque se ha perdido'], s: 1 },

        { k: 'voc', q: '¿Qué quiere decir «redonda»?', ok: 'Con forma de círculo', bad: ['Con forma de cuadrado', 'Muy pequeña'], s: 0 }

    { id: 'partido', len: 's', title: 'El partido del patio', emoji: ['⚽', '🏃', '🥅'],

    { id: 'manzana', len: 's', title: 'La manzana roja', emoji: ['🍎', '🐦', '🌳'],
      text: ['En el frutal hay una manzana roja.', 'Un pajarito se posa en la rama y prueba un poquito.', '¡Qué dulce está!', 'Llama a sus amigos para compartirla.', 'Comen todos juntos y muy contentos.'],
      qs: [
        { k: 'lit', q: '¿De qué color es la manzana?', ok: 'Roja', bad: ['Verde', 'Amarilla'], s: 0 },
        { k: 'ord', q: '¿Qué hace el pajarito después de probarla?', ok: 'Llama a sus amigos', bad: ['Se va volando solo', 'Planta una semilla'], s: 3 },

      qs: [
        { k: 'lit', q: '¿Dónde salta la rana?', ok: 'Sobre una hoja grande', bad: ['Sobre una piedra', 'Dentro del mar'], s: 2 },
        { k: 'ord', q: '¿Qué pasa al final del recorrido?', ok: 'El río llega al mar', bad: ['El río se seca', 'El río vuelve a la montaña'], s: 3 },
        { k: 'why', q: '¿Por qué suena el río como una canción?', ok: 'Porque pasa entre piedras', bad: ['Porque hay pájaros', 'Porque llueve fuerte'], s: 1 },
        { k: 'feel', q: '¿Cómo está el río al final?', ok: 'Tranquilo', bad: ['Enfadado', 'Asustado'], s: 3 },
        { k: 'voc', q: '¿Qué significa «descansa»?', ok: 'Se queda en calma', bad: ['Corre más rápido', 'Se hace pequeño'], s: 3 }
      ] },
    { id: 'cumple', len: 's', title: 'La tarta de Sara', emoji: ['🎂', '🕯️', '🎈'],
      text: ['Hoy es el cumpleaños de Sara.', 'Su familia le prepara una tarta con ocho velas.', 'Sara pide un deseo y sopla muy fuerte.', 'Todas las velas se apagan.', 'Sara está muy feliz y abraza a todos.'],
      qs: [
        { k: 'lit', q: '¿Cuántas velas tiene la tarta?', ok: 'Ocho', bad: ['Seis', 'Diez'], s: 1 },
        { k: 'ord', q: '¿Qué hace Sara antes de soplar?', ok: 'Pide un deseo', bad: ['Abraza a todos', 'Corta la tarta'], s: 2 },
        { k: 'why', q: '¿Por qué se apagan las velas?', ok: 'Porque Sara sopla fuerte', bad: ['Porque hace viento', 'Porque se acaba la tarta'], s: 2 },
        { k: 'feel', q: '¿Cómo se siente Sara?', ok: 'Muy feliz', bad: ['Muy triste', 'Con sueño'], s: 4 },
        { k: 'voc', q: '¿Qué es un deseo?', ok: 'Algo que quieres que pase', bad: ['Un regalo envuelto', 'Una vela grande'], s: 2 }

        { k: 'ord', q: '¿Qué hacen después de que cae el castillo?', ok: 'Empiezan otro castillo', bad: ['Vuelven a casa', 'Se van a comer'], s: 4 },

      const all = STORIES.filter((x) => x.len === L.len);
      const done = all.filter((x) => s.done[x.id]).length;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lvl';
      b.dataset.len = L.len;
      b.innerHTML = '<span class="lvl__e" aria-hidden="true"></span><span class="lvl__t"><span class="lvl__name"></span><span class="lvl__sub"></span><span class="lvl__bar" aria-hidden="true"></span></span><span class="lvl__side"></span>';

      b.querySelector('.lvl__name').textContent = L.name;
      b.querySelector('.lvl__sub').textContent = L.sub;

      all.forEach((x) => { const i = document.createElement('i'); if (s.done[x.id]) i.className = 'on'; bar.appendChild(i); });

  // Stories she has not finished come first. When all are done, any story except the last one played.
  function pickStory(len) {
    const s = load();
    const all = STORIES.filter((x) => x.len === len);
    let pool = all.filter((x) => !s.done[x.id]);
    if (!pool.length) pool = all.filter((x) => x.id !== s.last);
    return Kit.sample(pool.length ? pool : all, 1)[0];
  }

      p.appendChild(document.createTextNode(' '));

    $('story').scrollTop = 0;

    story = st;

  /* "Escuchar": sentence by sentence with the sentence being read highlighted. */
  let listenToken = 0;
  function setListenUi(on) { $('listen').textContent = on ? '⏹ Parar' : '🔊 Escuchar'; $('listen').setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function markReading(i) {
    document.querySelectorAll('#s-text .sn').forEach((n) => n.classList.toggle('is-reading', +n.dataset.i === i));
  }
  function stopListen() {
    listenToken++;

    markReading(-1);
    setListenUi(false);
  }
  async function listen() {
    const my = ++listenToken;
    setListenUi(true);
    for (let i = 0; i < story.text.length; i++) {
      if (my !== listenToken) return;
      markReading(i);
      const n = document.querySelector('#s-text .sn[data-i="' + i + '"]');
      if (n && n.scrollIntoView) n.scrollIntoView({ block: 'nearest' });
      const t0 = performance.now();
      await Kit.speak(story.text[i], 'es', { rate: 0.85 });
      if (my !== listenToken) return;
      // No voice (or muted): keep a calm reading pace so the highlight can be followed.
      if (performance.now() - t0 < 300) await sleep(story.text[i].split(/\s+/).length * 330);
    }
    if (my === listenToken) { markReading(-1); setListenUi(false); }
  }

  function optionsFor(q) {

      box.appendChild(d);

  }

      ans.hidden = true;
      $('next').textContent = 'Siguiente';
      if (!item.rep) { score++; results[item.orig] = true; }
    } else {
      Kit.sfx('ko');
      title.textContent = '✗ ' + Kit.encourage();
      ans.hidden = false;
      ans.textContent = 'Era: ' + item.q.ok;
      $('next').textContent = 'Ver en el cuento';
      if (!item.rep) {
        results[item.orig] = false;
        const at = Math.min(queue.length, pos + 3);
        queue.splice(at, 0, { q: item.q, orig: item.orig, rep: true });
      }
    }
    renderDots();
    $('next').focus({ preventScroll: true });
  }

  function next() {
    if (mode !== 'feedback') return;
    Kit.sfx('tap');
    const item = queue[pos];
    const missed = !!$('opts').querySelector('.is-ko');
    if (missed) { openRead('miss', item.q.s); return; }
    advance();
  }

  function advance() {
    pos++;
    if (pos >= queue.length) finish(); else showQuestion();
  }

  /* ---------- result ---------- */

  function finish() {
    mode = 'idle';
    const s = load();
    const n = Kit.stars.calc(score, story.qs.length);
    const done = Object.assign({}, s.done);
    done[story.id] = Math.max(done[story.id] || 0, n);
    store.set({ done, last: story.id });

    const extra = document.createElement('div');
    extra.className = 'k-center';
    extra.style.fontSize = '44px';
    extra.setAttribute('aria-hidden', 'true');
    extra.textContent = story.emoji.join(' ');

    const len = story.len;
    const sameStory = story;
    Kit.result({
      slug: SLUG, score, total: story.qs.length, extra,
      actions: [
        { label: 'Otro cuento', primary: true, onClick: () => startStory(pickStory(len)) },
        { label: 'Elegir cuentos', onClick: showStart }
      ],
      onAgain: () => startStory(sameStory)
    });
  }

  /* ---------- wiring ---------- */

  $('listen').addEventListener('click', () => {
    Kit.sfx('tap');
    if ($('listen').getAttribute('aria-pressed') === 'true') stopListen(); else listen();
  });
  $('done').addEventListener('click', () => {
    Kit.sfx('tap');
    stopListen();
    if (readMode === 'first') showQuestion();
    else if (readMode === 'again') { show('quiz'); mode = 'answering'; }
    else advance();
  });
  $('reread').addEventListener('click', () => { Kit.sfx('tap'); openRead('again'); });
  $('next').addEventListener('click', next);
  $('say').addEventListener('click', speakQuestion);
  $('rquit').addEventListener('click', () => { Kit.sfx('tap'); showStart(); });
  $('qquit').addEventListener('click', () => { Kit.sfx('tap'); showStart(); });

  document.addEventListener('keydown', (e) => {
    if (el.quiz.hidden || mode !== 'answering' || document.querySelector('.k-overlay') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[1-3]$/.test(e.key)) { e.preventDefault(); answer(+e.key - 1); }
  });

  Kit.mount({ slug: SLUG, title: 'Minicuentos' });
  Kit.ready.then(showStart);

  // Hooks for the automated checks (not used by the game itself).
  window.__cuentos = { STORIES, LEVELS, wordCount, optionsFor, BY_ID };
})();
</script>
</body>
</html>
